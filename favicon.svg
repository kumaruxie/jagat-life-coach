<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Background Circle ( Obsidian Dark ) -->
  <rect width="64" height="64" rx="16" fill="#141820"/>
  
  <!-- Subtle Emerald Inner Border Glow -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Brand Typography Initials: "AC" using an elegant serif / script inspired design -->
  <text x="32" y="44" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="34" 
        font-weight="bold" 
        text-anchor="middle" 
        letter-spacing="-1px">
    <tspan fill="#ffffff">A</tspan>
    <tspan fill="#10b981">C</tspan>
  </text>
  
  <!-- Elegant Accent Sparkle Dot -->
  <circle cx="48" cy="18" r="3" fill="#10b981"/>
</svg>